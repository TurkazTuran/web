<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text aus Bild erkennen und extrahieren</title>

  <style>
    :root {
      --page: #f4f7ff;
      --surface: rgba(255, 255, 255, 0.88);
      --border: #dce4f3;
      --border-strong: #7c8df8;
      --text: #17203a;
      --muted: #66708a;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #15846d;
      --danger: #e64b68;
      --danger-light: #fff0f3;
      --shadow: 0 22px 65px rgba(55, 72, 122, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 4% 4%, rgba(125, 211, 252, 0.45), transparent 27rem),
        radial-gradient(circle at 95% 6%, rgba(196, 181, 253, 0.48), transparent 31rem),
        radial-gradient(circle at 54% 100%, rgba(153, 246, 228, 0.43), transparent 30rem),
        var(--page);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      content: "";
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.48;
      pointer-events: none;
    }

    body::before {
      top: 18%;
      left: -180px;
      background: #bae6fd;
    }

    body::after {
      right: -145px;
      bottom: 5%;
      background: #c4b5fd;
    }

    .app {
      width: min(1080px, 100%);
      margin: 0 auto;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid #c7d2fe;
      border-radius: 18px;
      color: #ffffff;
      font-size: 25px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.24);
    }

    h1 {
      margin: 0;
      color: #1e2850;
      font-size: clamp(1.55rem, 4vw, 2.2rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .shortcut {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 13px;
      border: 1px solid #d9e2f1;
      border-radius: 12px;
      color: #52607a;
      font-size: 0.84rem;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 20px rgba(64, 83, 130, 0.07);
      backdrop-filter: blur(12px);
    }

    kbd {
      display: inline-grid;
      min-width: 23px;
      min-height: 23px;
      padding: 3px 6px;
      place-items: center;
      border: 1px solid #cfd8e8;
      border-bottom-color: #aebbd2;
      border-radius: 6px;
      color: #34405c;
      font: 700 0.75rem/1 Inter, sans-serif;
      background: #ffffff;
      box-shadow: 0 1px 1px rgba(39, 51, 81, 0.1);
    }

    .card {
      padding: clamp(16px, 4vw, 30px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 22px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 11px;
      color: #2a3656;
      font-size: 0.93rem;
      font-weight: 800;
    }

    .panel-title span {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 8px;
      color: #4f46e5;
      background: #eef2ff;
    }

    #dropZone {
      position: relative;
      display: grid;
      min-height: 360px;
      padding: 22px;
      place-items: center;
      overflow: hidden;
      border: 2px dashed #aab7ec;
      border-radius: 20px;
      cursor: pointer;
      outline: none;
      background:
        linear-gradient(145deg, rgba(238, 242, 255, 0.82), rgba(236, 253, 245, 0.78)),
        #f9fbff;
      transition: 180ms ease;
    }

    #dropZone::before {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(100, 116, 190, 0.11);
      border-radius: 15px;
      content: "";
      pointer-events: none;
    }

    #dropZone:hover,
    #dropZone:focus-visible,
    #dropZone.dragover {
      border-color: #6366f1;
      background:
        linear-gradient(145deg, rgba(224, 231, 255, 0.96), rgba(204, 251, 241, 0.94)),
        #f8faff;
      box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.12);
      transform: translateY(-2px);
    }

    .drop-content {
      position: relative;
      max-width: 300px;
      text-align: center;
    }

    .upload-icon {
      display: grid;
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      place-items: center;
      border: 1px solid #bfdbfe;
      border-radius: 23px;
      color: #4f46e5;
      font-size: 32px;
      background: linear-gradient(135deg, #e0e7ff, #dff8ff);
      box-shadow: 0 14px 32px rgba(79, 70, 229, 0.13);
    }

    .drop-content strong {
      display: block;
      color: #26355a;
      font-size: 1.05rem;
    }

    .drop-content p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.89rem;
      line-height: 1.5;
    }

    #preview {
      display: none;
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 320px;
      border: 1px solid #dce4f3;
      border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 17px 35px rgba(55, 72, 122, 0.16);
    }

    .action-row,
    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-row {
      margin-top: 13px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 43px;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      font: 750 0.88rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.01em;
      transition:
        transform 150ms ease,
        box-shadow 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid rgba(99, 102, 241, 0.34);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .button-primary {
      flex: 1;
      min-width: 160px;
      color: #ffffff;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      box-shadow: 0 10px 21px rgba(79, 70, 229, 0.25);
    }

    .button-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 15px 27px rgba(79, 70, 229, 0.32);
    }

    .button-secondary {
      border-color: #d7e0ef;
      color: #34405c;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 5px 13px rgba(64, 83, 130, 0.06);
    }

    .button-secondary:hover:not(:disabled) {
      border-color: #aebcf3;
      color: #3730a3;
      background: #f6f7ff;
      box-shadow: 0 9px 17px rgba(64, 83, 130, 0.1);
    }

    .button-danger {
      border-color: #fecdd6;
      color: #be2949;
      background: var(--danger-light);
    }

    .button-danger:hover:not(:disabled) {
      border-color: #fda4b4;
      background: #ffe4ea;
    }

    .result-panel {
      display: flex;
      min-height: 100%;
      flex-direction: column;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    #status {
      min-height: 21px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .status-ready {
      color: var(--success) !important;
    }

    .status-error {
      color: #d93355 !important;
    }

    progress {
      display: none;
      width: 100%;
      height: 8px;
      margin: 0 0 13px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      appearance: none;
    }

    progress::-webkit-progress-bar {
      background: #e7ecf6;
    }

    progress::-webkit-progress-value {
      border-radius: 999px;
      background: linear-gradient(90deg, #14b8a6, #38bdf8, #6366f1);
    }

    progress::-moz-progress-bar {
      border-radius: 999px;
      background: linear-gradient(90deg, #14b8a6, #38bdf8, #6366f1);
    }

    textarea {
      width: 100%;
      min-height: 320px;
      flex: 1;
      padding: 16px;
      border: 1px solid #dce4f3;
      border-radius: 17px;
      outline: none;
      resize: vertical;
      color: #26324e;
      background: rgba(255, 255, 255, 0.8);
      font: 0.9rem/1.62 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    textarea::placeholder {
      color: #98a3ba;
    }

    textarea:focus {
      border-color: var(--border-strong);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13);
    }

    .result-actions {
      margin-top: 13px;
    }

    .footer-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 19px 4px 0;
      color: #71809f;
      font-size: 0.8rem;
    }

    .footer-note span {
      color: #14b8a6;
    }

    @media (max-width: 760px) {
      body {
        padding: 20px 13px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .shortcut {
        width: 100%;
        justify-content: center;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      #dropZone {
        min-height: 270px;
      }

      textarea {
        min-height: 255px;
      }

      .button-primary {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">⌁</div>

        <div>
          <h1>Text aus Bild erkennen und extrahieren</h1>
          
        </div>
      </div>

      <div class="shortcut" title="Screenshot direkt aus der Zwischenablage einfügen">
        Einfügen:
        <kbd>Strg</kbd><span>+</span><kbd>V</kbd>
      </div>
    </header>

    <section class="card">
      <div class="grid">
        <section aria-labelledby="upload-title">
          <h2 id="upload-title" class="panel-title">
            <span aria-hidden="true">↥</span>
            Bild auswählen
          </h2>

          <input id="fileInput" type="file" accept="image/*" hidden />

          <div
            id="dropZone"
            role="button"
            tabindex="0"
            aria-label="Bild auswählen, Bild ablegen oder Screenshot einfügen"
          >
            <div id="dropText" class="drop-content">
              <div class="upload-icon" aria-hidden="true">▧</div>
              <strong>Screenshot oder Bild hinzufügen</strong>
              <p>
                Hierher ziehen, klicken zum Auswählen oder direkt aus der
                Zwischenablage einfügen.
              </p>
            </div>

            <img id="preview" alt="Vorschau des ausgewählten Bildes" />
          </div>

          <div class="action-row">
            <button id="clipboardButton" class="button-secondary" type="button">
              <span aria-hidden="true">▣</span>
              Zwischenablage lesen
            </button>

            <button id="ocrButton" class="button-primary" type="button" disabled>
              <span aria-hidden="true">✦</span>
              Text erkennen
            </button>
          </div>
        </section>

        <section class="result-panel" aria-labelledby="result-title">
          <div class="result-header">
            <h2 id="result-title" class="panel-title">
              <span aria-hidden="true">≡</span>
              Erkannter Text
            </h2>
          </div>

          <div id="status" aria-live="polite">
            Warte auf ein Bild oder einen eingefügten Screenshot.
          </div>

          <progress id="progressBar" value="0" max="100"></progress>

          <textarea
            id="result"
            placeholder="Der erkannte Text erscheint hier …"
            spellcheck="false"
            aria-label="Erkannter OCR-Text"
          ></textarea>

          <div class="result-actions">
            <button id="copyButton" class="button-secondary" type="button" disabled>
              <span aria-hidden="true">⧉</span>
              Text kopieren
            </button>

            <button id="downloadButton" class="button-secondary" type="button" disabled>
              <span aria-hidden="true">↓</span>
              Als TXT speichern
            </button>

            <button id="resetButton" class="button-danger" type="button">
              <span aria-hidden="true">↺</span>
              Zurücksetzen
            </button>
          </div>
        </section>
      </div>
    </section>

    
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const dropText = document.getElementById("dropText");
    const preview = document.getElementById("preview");
    const clipboardButton = document.getElementById("clipboardButton");
    const ocrButton = document.getElementById("ocrButton");
    const copyButton = document.getElementById("copyButton");
    const downloadButton = document.getElementById("downloadButton");
    const resetButton = document.getElementById("resetButton");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");

    let selectedFile = null;
    let previewUrl = null;

    function setStatus(message, type = "default") {
      status.textContent = message;
      status.classList.remove("status-ready", "status-error");

      if (type === "ready") {
        status.classList.add("status-ready");
      }

      if (type === "error") {
        status.classList.add("status-error");
      }
    }

    function showImage(file, source = "Bild") {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Bitte wähle eine gültige Bilddatei aus.", "error");
        return;
      }

      selectedFile = file;

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
      }

      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = "block";
      dropText.style.display = "none";

      result.value = "";
      ocrButton.disabled = false;
      copyButton.disabled = true;
      downloadButton.disabled = true;

      setStatus(`${source} übernommen. Du kannst jetzt die Texterkennung starten.`, "ready");
    }

    function resetApp() {
      selectedFile = null;
      fileInput.value = "";
      result.value = "";

      preview.removeAttribute("src");
      preview.style.display = "none";
      dropText.style.display = "block";

      ocrButton.disabled = true;
      copyButton.disabled = true;
      downloadButton.disabled = true;
      progressBar.style.display = "none";
      progressBar.value = 0;

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      setStatus("Warte auf ein Bild oder einen eingefügten Screenshot.");
    }

    dropZone.addEventListener("click", () => {
      fileInput.click();
    });

    dropZone.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener("change", () => {
      showImage(fileInput.files[0], "Bilddatei");
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });

    dropZone.addEventListener("drop", (event) => {
      const file = event.dataTransfer.files[0];

      if (file) {
        showImage(file, "Abgelegtes Bild");
      }
    });

    clipboardButton.addEventListener("click", async () => {
      if (!navigator.clipboard?.read) {
        setStatus(
          "Der Browser kann Bilder nicht direkt aus der Zwischenablage lesen. Nutze Strg+V oder Cmd+V.",
          "error"
        );
        return;
      }

      clipboardButton.disabled = true;
      setStatus("Zwischenablage wird gelesen …");

      try {
        const clipboardItems = await navigator.clipboard.read();

        for (const clipboardItem of clipboardItems) {
          const imageType = clipboardItem.types.find((type) =>
            type.startsWith("image/")
          );

          if (imageType) {
            const imageBlob = await clipboardItem.getType(imageType);
            const extension = imageType.split("/")[1] || "png";

            const imageFile = new File(
              [imageBlob],
              `zwischenablage-bild.${extension}`,
              { type: imageType }
            );

            showImage(imageFile, "Bild aus der Zwischenablage");
            return;
          }
        }

        setStatus(
          "In der Zwischenablage wurde kein Bild gefunden. Kopiere zuerst einen Screenshot.",
          "error"
        );
      } catch (error) {
        console.error(error);

        if (error.name === "NotAllowedError") {
          setStatus(
            "Der Browser hat den Zugriff auf die Zwischenablage blockiert. Erlaube die Berechtigung oder nutze Strg+V bzw. Cmd+V.",
            "error"
          );
        } else {
          setStatus(
            "Die Zwischenablage konnte nicht gelesen werden. Nutze alternativ Strg+V bzw. Cmd+V.",
            "error"
          );
        }
      } finally {
        clipboardButton.disabled = false;
      }
    });

    document.addEventListener("paste", (event) => {
      const items = event.clipboardData?.items;

      if (!items) {
        return;
      }

      for (const item of items) {
        if (item.type.startsWith("image/")) {
          const imageFile = item.getAsFile();

          if (imageFile) {
            showImage(imageFile, "Screenshot aus der Zwischenablage");
          }

          return;
        }
      }

      setStatus(
        "In der Zwischenablage wurde kein Bild gefunden. Kopiere zuerst einen Screenshot.",
        "error"
      );
    });

    ocrButton.addEventListener("click", async () => {
      if (!selectedFile) {
        return;
      }

      ocrButton.disabled = true;
      copyButton.disabled = true;
      downloadButton.disabled = true;
      progressBar.style.display = "block";
      progressBar.value = 0;
      setStatus("OCR wird vorbereitet …");

      try {
        const { data } = await Tesseract.recognize(selectedFile, "deu+eng", {
          logger: (message) => {
            if (message.status === "recognizing text") {
              const percent = Math.round(message.progress * 100);
              progressBar.value = percent;
              setStatus(`Text wird erkannt: ${percent} %`);
            }
          }
        });

        result.value = data.text.trim();

        if (result.value) {
          copyButton.disabled = false;
          downloadButton.disabled = false;
          setStatus("Texterkennung abgeschlossen.", "ready");
        } else {
          setStatus(
            "Kein Text erkannt. Nutze ein schärferes oder kontrastreicheres Bild.",
            "error"
          );
        }
      } catch (error) {
        console.error(error);
        setStatus(
          "Bei der Texterkennung ist ein Fehler aufgetreten. Prüfe deine Internetverbindung und versuche es erneut.",
          "error"
        );
      } finally {
        progressBar.style.display = "none";
        ocrButton.disabled = false;
      }
    });

    copyButton.addEventListener("click", async () => {
      if (!result.value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(result.value);
        setStatus("Der erkannte Text wurde in die Zwischenablage kopiert.", "ready");
      } catch {
        result.focus();
        result.select();
        document.execCommand("copy");
        setStatus("Der erkannte Text wurde in die Zwischenablage kopiert.", "ready");
      }
    });

    downloadButton.addEventListener("click", () => {
      if (!result.value) {
        return;
      }

      const blob = new Blob([result.value], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "snaptext-ocr-ergebnis.txt";
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
      setStatus("TXT-Datei wurde heruntergeladen.", "ready");
    });

    resetButton.addEventListener("click", resetApp);
  </script>
</body>
</html>
