<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unterlagenliste</title>
	<link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/64/10550/10550857.png">

	<style>
		@font-face {
			font-family: "BerlinTypeOffice";
			src: url("https://raw.githubusercontent.com/TurkazTuran/web/main/fonts/BerlinTypeOffice-Regular.ttf") format("truetype");
			font-weight: 400;
		}
		@font-face {
			font-family: "BerlinTypeOffice";
			src: url("https://raw.githubusercontent.com/TurkazTuran/web/main/fonts/BerlinTypeOffice-Bold.ttf") format("truetype");
			font-weight: 700;
		}

		:root {
			--bg: #eff2f8;
			--surface: #e3ebec;
			--surface-2: #d7e4f3;
			--border: #545d68;
			--text: #16202a;
			--muted: #66758a;
			--accent: #005f73;
			--accent-2: #0a9396;
			--danger: #dc2626;
			--shadow: 0 10px 30px rgba(15, 23, 42, .08);
			--shadow-soft: 0 4px 14px rgba(15, 23, 42, .06);
			--radius: 16px;
		}

		body.dark {
			--bg: #0f172a;
			--surface: #111827;
			--surface-2: #172033;
			--border: #25324a;
			--text: #e5edf8;
			--muted: #95a4bd;
			--accent: #22d3ee;
			--accent-2: #0891b2;
			--danger: #f87171;
			--shadow: 0 10px 30px rgba(0, 0, 0, .35);
			--shadow-soft: 0 4px 14px rgba(0, 0, 0, .25);
		}

		* { box-sizing: border-box; font-family: "BerlinTypeOffice","Berlin Type Office",Arial,sans-serif; }
		html, body { margin: 0; padding: 0; }

		body {
			min-height: 100vh;
			padding: clamp(10px, 1.2vw, 18px);
			background: var(--bg);
			color: var(--text);
			font-size: 14px;
		}

		.app-shell { max-width: min(1700px, calc(100vw - 24px)); margin: 0 auto; }

		.topbar, .toolbar, .bulk-actions, .summary-actions, .row-actions, .recipient-gender {
			display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
		}

		.topbar { justify-content: space-between; margin-bottom: 18px; }
		h2 { margin: 0; font-size: 28px; }

		button, input, select, textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 10px 12px;
		}

		button { cursor: pointer; font-weight: 700; box-shadow: var(--shadow-soft); }
		button:hover { transform: translateY(-1px); border-color: var(--accent); }
		button.primary, .tab-btn.active {
			color: #fff;
			border-color: transparent;
			background: linear-gradient(180deg, var(--accent), var(--accent-2));
		}
		button.ghost { background: transparent; box-shadow: none; }
		button.delete-btn { color: var(--danger); }

		input:focus, select:focus, textarea:focus, button:focus {
			outline: none;
			border-color: var(--accent);
			box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
		}

		input[type="checkbox"], input[type="radio"] {
			width: 16px; height: 16px; padding: 0; margin: 0; accent-color: var(--accent);
		}

		.card, .section {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
		}

		.view { display: none; }
		.view.active { display: block; }

		.category-panel {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			padding: 16px;
			margin-bottom: 18px;
		}

		.category-tools { display: grid; gap: 8px; align-content: start; }
		label { display: grid; gap: 6px; font-weight: 700; }

		.category-add, .inline-add {
			display: grid; grid-template-columns: 1fr auto; gap: 8px;
		}

		.category-checkbox-list {
			display: grid;
			gap: 4px;
			max-height: 260px;
			overflow-y: auto;
			padding: 8px;
			border: 1px solid var(--border);
			border-radius: 12px;
		}

		.category-checkbox-option {
			display: grid;
			grid-template-columns: 18px 1fr;
			gap: 8px;
			padding: 7px 8px;
			font-weight: 400;
			cursor: pointer;
			border-radius: 8px;
		}
		.category-checkbox-option:hover { background: var(--surface-2); }

		.recipient-panel { display: grid; gap: 8px; align-content: start; }
		.recipient-toggle {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			padding: 8px 10px;
			background: var(--surface-2);
			border: 1px solid var(--border);
			border-radius: 10px;
		}
		.recipient-main, .recipient-gender label {
			display: inline-flex; align-items: center; gap: 8px;
		}

		.section-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 16px;
		}

		.section { overflow: hidden; }
		.section-title {
			padding: 10px 16px;
			background: #a7afbd;
			color: #101828;
			border-bottom: 1px solid #0b0e93;
			font-weight: 700;
		}
		.section-body { padding: 12px; }

		.list-wrap { display: grid; gap: 6px; }

		.list-row {
			display: grid;
			grid-template-columns: 20px minmax(0, 1fr) auto;
			gap: 8px;
			align-items: center;
			padding: 6px 10px;
			background: var(--surface-2);
			border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
			border-radius: 10px;
		}

		.item-text {
			min-width: 0;
			font-size: 16px;
			line-height: 1.35;
			word-break: break-word;
		}

		.item-text a, .result-output a {
			color: var(--accent);
			font-weight: 700;
			text-decoration: underline;
			text-underline-offset: 2px;
		}

		.move-btn {
			width: 27px; height: 27px; padding: 0;
			display: inline-flex; align-items: center; justify-content: center;
			border-radius: 8px; box-shadow: none;
		}

		.selection-category-group {
			display: grid;
			gap: 6px;
			margin-bottom: 10px;
		}

		.group-header {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 10px 12px;
			background: #a7afbd;
			color: #101828;
			border: 1px solid #0b0e93;
			border-radius: 10px;
			font-weight: 700;
			cursor: pointer;
			user-select: none;
			margin-top: 6px;
		}
		.group-header:hover { filter: brightness(0.97); }

		.summary { margin-top: 18px; padding: 16px; }
		.summary h3 { margin: 0 0 8px; }

		.result-output {
			min-height: 160px;
			padding: 14px;
			border: 1px solid var(--border);
			border-radius: 12px;
			background: var(--surface);
			line-height: 1.65;
		}

		.empty-note { color: var(--muted); font-size: 12px; }
		.import-input, .copy-source { display: none; }

		.toast {
			position: fixed;
			right: 20px;
			bottom: 20px;
			z-index: 9999;
			padding: 14px 18px;
			border-radius: 14px;
			color: #fff;
			background: rgba(15, 23, 42, .92);
			box-shadow: var(--shadow);
			opacity: 0;
			transform: translateY(10px);
			transition: .25s;
			pointer-events: none;
		}
		.toast.show { opacity: 1; transform: translateY(0); }

		@media (max-width: 960px) {
			.category-panel, .section-grid { grid-template-columns: 1fr; }
			.topbar { align-items: flex-start; }
		}
	</style>
</head>

<body>
	<div class="app-shell">
		<div class="topbar">
			<h2>Erforderliche Unterlagen</h2>

			<div class="toolbar">
				<button class="tab-btn active" onclick="showView('inputView', this)">Werte eingeben</button>
				<button class="tab-btn" onclick="showView('selectView', this)">Auswahlliste</button>
				<button onclick="toggleTheme()">🌙 / ☀️ Theme</button>
				<button onclick="exportListData()">Liste exportieren</button>
				<button onclick="document.getElementById('importFile').click()">Liste importieren</button>
				<button class="ghost delete-btn" onclick="resetAllData()">Alles löschen</button>
				<input id="importFile" class="import-input" type="file" accept=".json,application/json" onchange="importListData(event)">
			</div>
		</div>

		<div id="inputView" class="view active">
			<div class="category-panel card">
				<div class="category-tools">
					<label for="categorySelect">
						<span>Bearbeitungskategorie</span>
						<select id="categorySelect" onchange="onCategoryChange(this.value)"></select>
						<span id="categoryHint" class="empty-note"></span>
					</label>

					<div class="category-add">
						<input id="newCategoryInput" type="text" placeholder="Neue Kategorie erstellen..." onkeydown="if(event.key==='Enter'){event.preventDefault();addCategory();}">
						<button class="primary" type="button" onclick="addCategory()">Kategorie hinzufügen</button>
					</div>

					<div class="bulk-actions">
						<button type="button" onclick="editActiveCategory()">Kategorie umbenennen</button>
						<button class="delete-btn" type="button" onclick="removeActiveCategory()">Kategorie löschen</button>
					</div>
				</div>

				<div class="category-tools">
					<textarea id="bulkInput" rows="6" placeholder="Mehrere Unterlagen einfügen – jede Zeile wird als eigener Eintrag gespeichert"></textarea>

					<div class="bulk-actions">
						<select id="bulkTargetSelector">
							<option value="ast">Für Antragsteller</option>
							<option value="lp">Für Lebenspartner</option>
							<option value="ki">Für Kind</option>
						</select>
						<button class="primary" type="button" onclick="addBulkItems()">Einträge hinzufügen</button>
					</div>
				</div>
			</div>

			<div class="section-grid">
				<div class="section">
					<div class="section-title">Unterlagen Antragsteller</div>
					<div id="astList" class="section-body list-wrap"></div>
				</div>

				<div class="section">
					<div class="section-title">Unterlagen Lebenspartner</div>
					<div id="lpList" class="section-body list-wrap"></div>
				</div>

				<div class="section">
					<div class="section-title">Unterlagen Kind</div>
					<div id="kiList" class="section-body list-wrap"></div>
				</div>
			</div>
		</div>

		<div id="selectView" class="view">
			<div class="category-panel card">
				<div class="category-tools">
					<div id="selectionCategoryList" class="category-checkbox-list"></div>
					<span id="selectionCategoryHint" class="empty-note"></span>
				</div>

				<div class="recipient-panel">
					<div class="recipient-toggle">
						<label class="recipient-main">
							<input id="includeApplicant" type="checkbox" checked onchange="setIncludeTargets()">
							<span>Antragsteller</span>
						</label>
					</div>

					<div class="recipient-toggle">
						<label class="recipient-main">
							<input id="includePartner" type="checkbox" checked onchange="setIncludeTargets()">
							<span>Lebenspartner</span>
						</label>

						<div class="recipient-gender">
							<label><input type="radio" name="partnerGender" value="mann" onchange="setPartnerGender(this.value)"> Mann</label>
							<label><input type="radio" name="partnerGender" value="frau" onchange="setPartnerGender(this.value)"> Frau</label>
						</div>
					</div>

					<div class="recipient-toggle">
						<label class="recipient-main">
							<input id="includeChild" type="checkbox" checked onchange="setIncludeTargets()">
							<span>Kind</span>
						</label>
					</div>
				</div>
			</div>

			<div class="section-grid">
				<div id="selectionAstSection" class="section">
					<div class="section-title">Unterlagen Antragsteller</div>
					<div id="selectionAstList" class="section-body list-wrap"></div>
				</div>

				<div id="selectionLpSection" class="section">
					<div class="section-title">Unterlagen Lebenspartner</div>
					<div id="selectionLpList" class="section-body list-wrap"></div>
				</div>

				<div id="selectionKiSection" class="section">
					<div class="section-title">Unterlagen Kind</div>
					<div id="selectionKiList" class="section-body list-wrap"></div>
				</div>
			</div>

			<div class="summary card">
				<h3>Ausgewählte Unterlagen</h3>
				<div id="selectedText" class="result-output"></div>

				<div class="summary-actions">
					<button class="primary" onclick="copySummary()">Ergebnis kopieren</button>
					<button class="ghost" onclick="clearSelectionsOnly()">Auswahl zurücksetzen</button>
				</div>
			</div>
		</div>
	</div>

	<div id="toast" class="toast"></div>
	<div id="copySource" class="copy-source" contenteditable="true"></div>

	<script>
		const STORAGE_APP_DATA = "unterlagenCombinedData";
		const STORAGE_SELECTED_CATEGORY_IDS = "unterlagenSelectedCategoryIds";
		const STORAGE_THEME = "unterlagenThemeMode";
		const STORAGE_INCLUDE_TARGETS = "unterlagenIncludeTargets";
		const STORAGE_PARTNER_GENDER = "unterlagenPartnerGender";
		const STORAGE_OPEN_GROUPS = "unterlagenOpenGroups";
		const FONT_STACK = "'BerlinTypeOffice','Berlin Type Office',Arial,sans-serif";

		let appData = loadAppData();
		let selectedCategoryIds = loadSelectedCategoryIds();
		let includeTargets = loadIncludeTargets();
		let partnerGender = localStorage.getItem(STORAGE_PARTNER_GENDER) === "mann" ? "mann" : "frau";
		let openGroups = loadOpenGroups();

		const categorySelect = document.getElementById("categorySelect");
		const categoryHint = document.getElementById("categoryHint");
		const newCategoryInput = document.getElementById("newCategoryInput");
		const bulkInput = document.getElementById("bulkInput");
		const bulkTargetSelector = document.getElementById("bulkTargetSelector");
		const selectionCategoryList = document.getElementById("selectionCategoryList");
		const selectionCategoryHint = document.getElementById("selectionCategoryHint");
		const includeApplicant = document.getElementById("includeApplicant");
		const includePartner = document.getElementById("includePartner");
		const includeChild = document.getElementById("includeChild");
		const astList = document.getElementById("astList");
		const lpList = document.getElementById("lpList");
		const kiList = document.getElementById("kiList");
		const selectionAstList = document.getElementById("selectionAstList");
		const selectionLpList = document.getElementById("selectionLpList");
		const selectionKiList = document.getElementById("selectionKiList");
		const selectionAstSection = document.getElementById("selectionAstSection");
		const selectionLpSection = document.getElementById("selectionLpSection");
		const selectionKiSection = document.getElementById("selectionKiSection");
		const selectedText = document.getElementById("selectedText");
		const toast = document.getElementById("toast");
		const copySource = document.getElementById("copySource");

		function makeId() {
			return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
		}

		function escapeHtml(text) {
			const div = document.createElement("div");
			div.textContent = String(text ?? "");
			return div.innerHTML;
		}

		function escapeJs(text) {
			return String(text ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
		}

		function linkifyText(text) {
			const escaped = escapeHtml(text);
			return escaped.replace(
				/(https?:\/\/[^\s<)"']+)/g,
				url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
			);
		}

		function normalizeImportedList(list) {
			if (!Array.isArray(list)) return [];
			return list.map(item => {
				if (!item || typeof item.text !== "string") return null;
				return {
					id: item.id || makeId(),
					text: item.text,
					selected: item.selected === true
				};
			}).filter(Boolean);
		}

		function normalizeAppData(rawData) {
			const sourceCategories = Array.isArray(rawData?.kategorien) ? rawData.kategorien : [];
			const ids = new Set();

			const kategorien = sourceCategories.map(category => {
				const id = Number(category?.id);
				const titel = String(category?.titel || "").trim();

				if (!Number.isInteger(id) || !titel || ids.has(id)) return null;
				ids.add(id);

				return {
					id,
					titel,
					ast_items: normalizeImportedList(category.ast_items),
					lp_items: normalizeImportedList(category.lp_items),
					ki_items: normalizeImportedList(category.ki_items)
				};
			}).filter(Boolean).sort((a, b) => a.id - b.id);

			const requestedId = Number(rawData?.active_category_id);
			const activeId = kategorien.some(category => category.id === requestedId)
				? requestedId
				: (kategorien[0]?.id || null);

			return {
				version: 6,
				exported_at: rawData?.exported_at || new Date().toISOString(),
				active_category_id: activeId,
				kategorien
			};
		}

		function createEmptyAppData() {
			return {
				version: 6,
				exported_at: new Date().toISOString(),
				active_category_id: null,
				kategorien: []
			};
		}

		function loadAppData() {
			try {
				const raw = JSON.parse(localStorage.getItem(STORAGE_APP_DATA));
				return raw ? normalizeAppData(raw) : createEmptyAppData();
			} catch {
				return createEmptyAppData();
			}
		}

		function saveAppData() {
			appData.exported_at = new Date().toISOString();
			localStorage.setItem(STORAGE_APP_DATA, JSON.stringify(appData));
		}

		function loadSelectedCategoryIds() {
			try {
				const stored = JSON.parse(localStorage.getItem(STORAGE_SELECTED_CATEGORY_IDS));
				if (Array.isArray(stored)) {
					return stored.map(Number).filter(id =>
						appData.kategorien.some(category => category.id === id)
					);
				}
			} catch {}
			return appData.active_category_id ? [appData.active_category_id] : [];
		}

		function saveSelectedCategoryIds() {
			localStorage.setItem(STORAGE_SELECTED_CATEGORY_IDS, JSON.stringify(selectedCategoryIds));
		}

		function loadIncludeTargets() {
			try {
				const raw = JSON.parse(localStorage.getItem(STORAGE_INCLUDE_TARGETS));
				return {
					applicant: raw?.applicant !== false,
					partner: raw?.partner !== false,
					child: raw?.child !== false
				};
			} catch {
				return { applicant: true, partner: true, child: true };
			}
		}

		function saveIncludeTargets() {
			localStorage.setItem(STORAGE_INCLUDE_TARGETS, JSON.stringify(includeTargets));
		}

		function loadOpenGroups() {
			try {
				const raw = JSON.parse(localStorage.getItem(STORAGE_OPEN_GROUPS));
				return raw && typeof raw === "object" ? raw : {};
			} catch {
				return {};
			}
		}

		function saveOpenGroups() {
			localStorage.setItem(STORAGE_OPEN_GROUPS, JSON.stringify(openGroups));
		}

		function makeGroupKey(target, categoryId, groupTitle) {
			return `${target}|${categoryId}|${groupTitle}`;
		}

		function isItemGroupHeader(text) {
			return /^\s*\d+\.\s+/.test(String(text || "").trim());
		}

		function splitListIntoGroups(list) {
			const groups = [];
			let current = null;

			list.forEach(item => {
				const txt = String(item?.text || "").trim();

				if (isItemGroupHeader(txt)) {
					current = { title: txt, items: [] };
					groups.push(current);
					return;
				}

				if (!current) return;
				current.items.push(item);
			});

			return groups.filter(group => group.items.length > 0);
		}

		function toggleSelectionGroup(target, categoryId, groupTitle) {
			const key = makeGroupKey(target, categoryId, groupTitle);
			const isCategoryToggle = groupTitle === "__category__";
			const willOpen = openGroups[key] !== true;

			if (isCategoryToggle) {
				Object.keys(openGroups).forEach(existingKey => {
					if (existingKey.startsWith(`${target}|`) && existingKey.endsWith("|__category__")) {
						openGroups[existingKey] = false;
					}
				});
			} else {
				Object.keys(openGroups).forEach(existingKey => {
					if (existingKey.startsWith(`${target}|${categoryId}|`) && !existingKey.endsWith("|__category__")) {
						openGroups[existingKey] = false;
					}
				});
			}

			openGroups[key] = willOpen;
			saveOpenGroups();
			renderAll();
		}

		function getActiveCategory() {
			return appData.kategorien.find(category => category.id === appData.active_category_id) || null;
		}

		function getList(category, target) {
			if (!category) return [];
			if (target === "ast") return category.ast_items;
			if (target === "lp") return category.lp_items;
			return category.ki_items;
		}

		function getNextCategoryId() {
			return appData.kategorien.length
				? Math.max(...appData.kategorien.map(category => category.id)) + 1
				: 1;
		}

		function showView(viewId, button) {
			document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
			document.querySelectorAll(".tab-btn").forEach(tab => tab.classList.remove("active"));

			document.getElementById(viewId).classList.add("active");
			button.classList.add("active");
			renderAll();
		}

		function initTheme() {
			document.body.classList.toggle("dark", localStorage.getItem(STORAGE_THEME) === "dark");
		}

		function toggleTheme() {
			const isDark = document.body.classList.toggle("dark");
			localStorage.setItem(STORAGE_THEME, isDark ? "dark" : "light");
		}

		function renderCategoryOptions() {
			if (!appData.kategorien.length) {
				categorySelect.innerHTML = "";
				categorySelect.disabled = true;
				categoryHint.textContent = "Noch keine Kategorie. Bitte eine Kategorie hinzufügen.";
				return;
			}

			categorySelect.disabled = false;
			categorySelect.innerHTML = appData.kategorien.map(category => `
				<option value="${category.id}" ${category.id === appData.active_category_id ? "selected" : ""}>
					${category.id}. ${escapeHtml(category.titel)}
				</option>
			`).join("");

			const active = getActiveCategory();
			categoryHint.textContent = active ? `Aktive Kategorie: ${active.id}. ${active.titel}` : "";
		}

		function renderSelectionCategoryOptions() {
			if (!appData.kategorien.length) {
				selectionCategoryList.innerHTML = "";
				selectionCategoryHint.textContent = "Erstelle zuerst Kategorien in „Werte eingeben“.";
				return;
			}

			selectionCategoryList.innerHTML = appData.kategorien.map(category => `
				<label class="category-checkbox-option">
					<input
						type="checkbox"
						${selectedCategoryIds.includes(category.id) ? "checked" : ""}
						onchange="onSelectionCategoryToggle(${category.id}, this.checked)">
					<span>${category.id}. ${escapeHtml(category.titel)}</span>
				</label>
			`).join("");

			selectionCategoryHint.textContent = `${selectedCategoryIds.length} von ${appData.kategorien.length} Kategorie(n) ausgewählt.`;
		}

		function renderEditableList(target, container) {
			const category = getActiveCategory();
			const list = getList(category, target);

			if (!category) {
				container.innerHTML = '<div class="empty-note">Bitte zuerst eine Kategorie erstellen.</div>';
				return;
			}
			if (!list.length) {
				container.innerHTML = '<div class="empty-note">Noch keine Unterlagen vorhanden.</div>';
				return;
			}

			container.innerHTML = list.map(item => `
				<div class="list-row">
					<input type="checkbox"
						${item.selected ? "checked" : ""}
						onchange="toggleItemSelection('${target}', '${escapeJs(item.id)}', this.checked)">
					<div class="item-text">${linkifyText(item.text)}</div>
					<div class="row-actions">
						<button class="ghost move-btn" title="Eintrag bearbeiten"
							onclick="editItem('${target}', '${escapeJs(item.id)}')">✎</button>
						<button class="ghost move-btn delete-btn" title="Eintrag löschen"
							onclick="deleteItem('${target}', '${escapeJs(item.id)}')">×</button>
						<button class="ghost move-btn" title="Nach oben"
							onclick="moveItem('${target}', '${escapeJs(item.id)}', -1)">↑</button>
						<button class="ghost move-btn" title="Nach unten"
							onclick="moveItem('${target}', '${escapeJs(item.id)}', 1)">↓</button>
					</div>
				</div>
			`).join("");
		}

		function renderSelectionList(target, container) {
			if (!selectedCategoryIds.length) {
				container.innerHTML = '<div class="empty-note">Wähle oben mindestens eine Kategorie aus.</div>';
				return;
			}

			let content = "";

			selectedCategoryIds.forEach(categoryId => {
				const category = appData.kategorien.find(entry => entry.id === categoryId);
				if (!category) return;

				const list = getList(category, target);
				const groups = splitListIntoGroups(list);

				const categoryKey = makeGroupKey(target, category.id, "__category__");
				const categoryOpen = openGroups[categoryKey] !== false;
				const catArrow = categoryOpen ? "▾" : "▸";

				content += `<div class="selection-category-group">`;
				content += `
					<div class="group-header" onclick="toggleSelectionGroup('${target}', ${category.id}, '__category__')">
						<span>${catArrow}</span>
						<span>${category.id}. ${escapeHtml(category.titel)}</span>
					</div>
				`;

				if (categoryOpen) {
					if (!list.length) {
						content += '<div class="empty-note">Keine Unterlagen in dieser Kategorie.</div>';
					} else if (!groups.length) {
						content += list.map(item => `
							<div class="list-row">
								<input type="checkbox"
									${item.selected ? "checked" : ""}
									onchange="toggleCategoryItemSelection('${target}', ${category.id}, '${escapeJs(item.id)}', this.checked)">
								<div class="item-text">${linkifyText(item.text)}</div>
								<div></div>
							</div>
						`).join("");
					} else {
						groups.forEach(group => {
							const key = makeGroupKey(target, category.id, group.title);
							const isOpen = openGroups[key] === true;
							const arrow = isOpen ? "▾" : "▸";

							content += `
								<div class="group-header" onclick="toggleSelectionGroup('${target}', ${category.id}, '${escapeJs(group.title)}')">
									<span>${arrow}</span>
									<span>${escapeHtml(group.title)}</span>
								</div>
							`;

							if (isOpen) {
								content += group.items.map(item => `
									<div class="list-row">
										<input type="checkbox"
											${item.selected ? "checked" : ""}
											onchange="toggleCategoryItemSelection('${target}', ${category.id}, '${escapeJs(item.id)}', this.checked)">
										<div class="item-text">${linkifyText(item.text)}</div>
										<div></div>
									</div>
								`).join("");
							}
						});
					}
				}

				content += `</div>`;
			});

			container.innerHTML = content;
		}

		function updateSelectionSectionVisibility() {
			selectionAstSection.style.display = includeTargets.applicant ? "" : "none";
			selectionLpSection.style.display = includeTargets.partner ? "" : "none";
			selectionKiSection.style.display = includeTargets.child ? "" : "none";
		}

		function renderAll() {
			renderCategoryOptions();
			renderSelectionCategoryOptions();
			renderEditableList("ast", astList);
			renderEditableList("lp", lpList);
			renderEditableList("ki", kiList);
			renderSelectionList("ast", selectionAstList);
			renderSelectionList("lp", selectionLpList);
			renderSelectionList("ki", selectionKiList);
			syncIncludeTargetCheckboxes();
			syncPartnerGenderRadios();
			updateSelectionSectionVisibility();
			updateSummary();
		}

		function onCategoryChange(nextId) {
			const id = Number(nextId);
			if (!appData.kategorien.some(category => category.id === id)) return;

			appData.active_category_id = id;
			saveAppData();
			renderAll();
			showToast("Bearbeitungskategorie gewechselt");
		}

		function addCategory() {
			const titel = newCategoryInput.value.trim();
			if (!titel) {
				alert("Bitte einen Kategorienamen eingeben.");
				return;
			}

			const category = {
				id: getNextCategoryId(),
				titel,
				ast_items: [],
				lp_items: [],
				ki_items: []
			};

			appData.kategorien.push(category);
			appData.active_category_id = category.id;
			selectedCategoryIds = [category.id];

			newCategoryInput.value = "";
			saveAppData();
			saveSelectedCategoryIds();
			renderAll();
			showToast("Kategorie hinzugefügt");
		}

		function editActiveCategory() {
			const category = getActiveCategory();
			if (!category) {
				alert("Bitte zuerst eine Kategorie erstellen.");
				return;
			}

			const title = prompt("Kategorienamen bearbeiten:", category.titel);
			if (title === null) return;

			const cleanedTitle = title.trim();
			if (!cleanedTitle) {
				alert("Der Kategoriename darf nicht leer sein.");
				return;
			}

			category.titel = cleanedTitle;
			saveAppData();
			renderAll();
			showToast("Kategorie umbenannt");
		}

		function removeActiveCategory() {
			const category = getActiveCategory();
			if (!category) {
				alert("Es gibt keine Kategorie zum Löschen.");
				return;
			}

			if (!confirm(`Kategorie „${category.titel}“ wirklich löschen?`)) return;

			const index = appData.kategorien.findIndex(entry => entry.id === category.id);
			appData.kategorien.splice(index, 1);

			appData.active_category_id =
				appData.kategorien[Math.max(0, index - 1)]?.id ||
				appData.kategorien[0]?.id ||
				null;

			selectedCategoryIds = selectedCategoryIds.filter(id => id !== category.id);
			if (!selectedCategoryIds.length && appData.active_category_id) {
				selectedCategoryIds = [appData.active_category_id];
			}

			openGroups = {};
			saveOpenGroups();

			saveAppData();
			saveSelectedCategoryIds();
			renderAll();
			showToast("Kategorie gelöscht");
		}

		function addBulkItems() {
			const category = getActiveCategory();
			if (!category) {
				alert("Bitte zuerst eine Kategorie erstellen.");
				return;
			}

			const lines = bulkInput.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
			if (!lines.length) {
				alert("Bitte mindestens eine Unterlage eingeben.");
				return;
			}

			const target = bulkTargetSelector.value;
			const list = getList(category, target);

			lines.forEach(text => {
				list.push({
					id: makeId(),
					text,
					selected: false
				});
			});

			bulkInput.value = "";
			saveAppData();
			renderAll();
			showToast(`${lines.length} Eintrag(e) hinzugefügt`);
		}

		function editItem(target, itemId) {
			const category = getActiveCategory();
			const item = getList(category, target).find(entry => entry.id === itemId);
			if (!item) return;

			const value = prompt("Unterlage bearbeiten:", item.text);
			if (value === null) return;

			const text = value.trim();
			if (!text) {
				alert("Der Eintrag darf nicht leer sein.");
				return;
			}

			item.text = text;
			saveAppData();
			renderAll();
			showToast("Eintrag bearbeitet");
		}

		function deleteItem(target, itemId) {
			const category = getActiveCategory();
			const list = getList(category, target);
			const index = list.findIndex(entry => entry.id === itemId);

			if (index === -1) return;
			if (!confirm("Diesen Eintrag wirklich löschen?")) return;

			list.splice(index, 1);
			saveAppData();
			renderAll();
			showToast("Eintrag gelöscht");
		}

		function moveItem(target, itemId, direction) {
			const category = getActiveCategory();
			const list = getList(category, target);
			const index = list.findIndex(entry => entry.id === itemId);
			const nextIndex = index + direction;

			if (index === -1 || nextIndex < 0 || nextIndex >= list.length) return;

			const [item] = list.splice(index, 1);
			list.splice(nextIndex, 0, item);

			saveAppData();
			renderAll();
		}

		function toggleItemSelection(target, itemId, checked) {
			const item = getList(getActiveCategory(), target).find(entry => entry.id === itemId);
			if (!item) return;

			item.selected = checked;
			saveAppData();
			renderAll();
		}

		function toggleCategoryItemSelection(target, categoryId, itemId, checked) {
			const category = appData.kategorien.find(entry => entry.id === categoryId);
			const item = getList(category, target).find(entry => entry.id === itemId);
			if (!item) return;

			item.selected = checked;
			saveAppData();
			renderAll();
		}

		function onSelectionCategoryToggle(categoryId, checked) {
			if (checked && !selectedCategoryIds.includes(categoryId)) {
				selectedCategoryIds.push(categoryId);
			}
			if (!checked) {
				selectedCategoryIds = selectedCategoryIds.filter(id => id !== categoryId);
			}

			openGroups = {};
			saveOpenGroups();

			saveSelectedCategoryIds();
			renderAll();
		}

		function setIncludeTargets() {
			includeTargets = {
				applicant: includeApplicant.checked,
				partner: includePartner.checked,
				child: includeChild.checked
			};
			saveIncludeTargets();
			renderAll();
		}

		function syncIncludeTargetCheckboxes() {
			includeApplicant.checked = includeTargets.applicant;
			includePartner.checked = includeTargets.partner;
			includeChild.checked = includeTargets.child;
		}

		function setPartnerGender(value) {
			partnerGender = value === "mann" ? "mann" : "frau";
			localStorage.setItem(STORAGE_PARTNER_GENDER, partnerGender);
			updateSummary();
		}

		function syncPartnerGenderRadios() {
			document.querySelectorAll("input[name='partnerGender']").forEach(radio => {
				radio.checked = radio.value === partnerGender;
			});
		}

		function getSectionsForExport() {
			const selectedCategories = appData.kategorien.filter(category => selectedCategoryIds.includes(category.id));

			const selectedItems = target => selectedCategories.flatMap(category =>
				getList(category, target).filter(item => item.selected).map(item => item.text)
			);

			const sections = [];
			const applicant = selectedItems("ast");
			const partner = selectedItems("lp");
			const child = selectedItems("ki");

			if (includeTargets.applicant && applicant.length) sections.push({ title: "Von Ihnen", items: applicant });
			if (includeTargets.partner && partner.length) {
				sections.push({
					title: partnerGender === "frau" ? "Von Ihrer Ehefrau" : "Von Ihrem Ehemann",
					items: partner
				});
			}
			if (includeTargets.child && child.length) sections.push({ title: "Von Ihrem Kind", items: child });

			return sections;
		}

		function buildSummaryHtml(forClipboard = false) {
			const sections = getSectionsForExport();
			const fontSize = forClipboard ? "11pt" : "14px";

			if (!sections.length) {
				return `<div style="font-family:${FONT_STACK};font-size:${fontSize};">Keine Unterlagen ausgewählt.</div>`;
			}

			let html = `<div style="font-family:${FONT_STACK};font-size:${fontSize};line-height:1.6;">`;

			sections.forEach((section, index) => {
				if (index) html += `<br>`;
				html += `<div style="font-weight:700;color:#e10600;">${escapeHtml(section.title)}:</div><br>`;
				html += `<ul style="margin:0 0 0 40px;padding:0;font-family:${FONT_STACK};font-size:${fontSize};">`;
				section.items.forEach(item => {
					html += `<li style="margin:0 0 4px;">${linkifyText(item)}</li>`;
				});
				html += `</ul>`;
			});

			return html + "</div>";
		}

		function buildSummaryText() {
			const sections = getSectionsForExport();
			if (!sections.length) return "Keine Unterlagen ausgewählt.";

			const lines = [];
			sections.forEach((section, index) => {
				if (index) lines.push("");
				lines.push(`${section.title}:`);
				lines.push("");
				section.items.forEach(item => lines.push(`☑ ${item}`));
			});
			return lines.join("\n");
		}

		function updateSummary() {
			selectedText.innerHTML = buildSummaryHtml(false);
		}

		async function copySummary() {
			const htmlContent = buildSummaryHtml(true);
			const textContent = buildSummaryText();

			try {
				if (navigator.clipboard && window.ClipboardItem) {
					await navigator.clipboard.write([
						new ClipboardItem({
							"text/html": new Blob([htmlContent], { type: "text/html" }),
							"text/plain": new Blob([textContent], { type: "text/plain" })
						})
					]);
					showToast("Ergebnis kopiert");
					return;
				}
			} catch {}

			try {
				copySource.innerHTML = htmlContent;
				const range = document.createRange();
				range.selectNodeContents(copySource);

				const selection = window.getSelection();
				selection.removeAllRanges();
				selection.addRange(range);

				document.execCommand("copy");
				selection.removeAllRanges();

				showToast("Ergebnis kopiert");
			} catch {
				try {
					await navigator.clipboard.writeText(textContent);
					showToast("Nur Text kopiert");
				} catch {
					alert("Kopieren fehlgeschlagen.");
				}
			}
		}

		function clearSelectionsOnly() {
			appData.kategorien.filter(category => selectedCategoryIds.includes(category.id)).forEach(category => {
				["ast_items", "lp_items", "ki_items"].forEach(key => {
					category[key] = category[key].map(item => ({ ...item, selected: false }));
				});
			});

			includeTargets = { applicant: true, partner: true, child: true };
			partnerGender = "frau";

			saveAppData();
			saveIncludeTargets();
			localStorage.setItem(STORAGE_PARTNER_GENDER, partnerGender);

			renderAll();
			showToast("Auswahl zurückgesetzt");
		}

		function exportListData() {
			const payload = {
				version: 6,
				exported_at: new Date().toISOString(),
				active_category_id: appData.active_category_id,
				kategorien: appData.kategorien
			};

			const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
			downloadBlob(blob, "unterlagen-liste.json");
			showToast("Liste exportiert");
		}

		function importListData(event) {
			const file = event.target.files?.[0];
			if (!file) return;

			const reader = new FileReader();
			reader.onload = loadEvent => {
				try {
					appData = normalizeAppData(JSON.parse(loadEvent.target.result));
					selectedCategoryIds = appData.active_category_id ? [appData.active_category_id] : [];

					openGroups = {};
					saveOpenGroups();

					saveAppData();
					saveSelectedCategoryIds();
					renderAll();
					showToast("Liste importiert");
				} catch {
					alert("Import fehlgeschlagen. Bitte eine gültige JSON-Datei auswählen.");
				} finally {
					event.target.value = "";
				}
			};
			reader.readAsText(file);
		}

		function resetAllData() {
			if (!confirm("Wirklich alle Kategorien und Unterlagen löschen?")) return;

			appData = createEmptyAppData();
			selectedCategoryIds = [];
			includeTargets = { applicant: true, partner: true, child: true };
			partnerGender = "frau";
			openGroups = {};
			bulkInput.value = "";

			saveAppData();
			saveSelectedCategoryIds();
			saveIncludeTargets();
			saveOpenGroups();
			localStorage.setItem(STORAGE_PARTNER_GENDER, partnerGender);

			renderAll();
			showToast("Alle Daten gelöscht");
		}

		function downloadBlob(blob, filename) {
			const url = URL.createObjectURL(blob);
			const link = document.createElement("a");
			link.href = url;
			link.download = filename;
			document.body.appendChild(link);
			link.click();
			link.remove();
			URL.revokeObjectURL(url);
		}

		function showToast(message) {
			toast.textContent = message;
			toast.classList.add("show");

			clearTimeout(showToast.timer);
			showToast.timer = setTimeout(() => {
				toast.classList.remove("show");
			}, 1800);
		}

		initTheme();
		renderAll();
	</script>
</body>
</html>
